<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>exersice 4</title>
</head>
<body>
    <label for="shipmentType">select shipment type</label>
    <select id="shipmentType" onchange="updateShipment()">
        <option value="standard">Standard: 7 days</option>
        <option value="express">Express: 3 days</option>
    </select>
    <p>Order Date: <span id="orderDate"></span></p>
    <p>Expected Delivery Date: <span id="deliveryDate"></span></p>
    <p>Delivery Fee: $<span id="deliveryFee"></span></p>
    <label for="phoneSelect">Select a Phone:</label>
    <select id="phoneSelect" onchange="updateProduct()">
        <option value="iphone_se_red">iPhone SE 64GB Red</option>
        <option value="iphone_11_black">iPhone 11 128GB Black</option>
        <option value="iphone_8_plus_silver">iPhone 8 Plus 64GB Silver</option>
    </select>

    <h2 id="productName"></h2>
    <p id="productPrice"></p>
    <img id="productImage" src="" alt="Product Image" width="200">
    <script>
        var shipments = 
        {
            'standard': {
                'leadTime': 7,
                'fee': 2
            },
            'express': {
                'leadTime': 3,
                'fee': 4.5
            }
        };
        function updateShipment() {
            var shipmentType = document.getElementById("shipmentType").value;
            var orderDate = new Date();
            var leadTime = shipments[shipmentType].leadTime;
            var deliveryDate = new Date(orderDate);
            deliveryDate.setDate(orderDate.getDate() + leadTime);
            
            document.getElementById("orderDate").textContent = orderDate.toISOString().split('T')[0];
            document.getElementById("deliveryDate").textContent = deliveryDate.toISOString().split('T')[0];
            document.getElementById("deliveryFee").textContent = shipments[shipmentType].fee.toFixed(2);
        }
        updateShipment();
        var phones = {
            'iphone_se_red': {
                'name': 'iPhone SE 64GB Red',
                'price': '450',
                'currency': 'US$',
                'imageUrl': "https://www.mhr.pt/232729-large_default/apple-iphone-se-64gb-red.jpg"
            },
            'iphone_11_black': {
                'name': 'iPhone 11 128GB Black',
                'price': '869',
                'currency': 'EUR',
                'imageUrl': "https://assets.swappie.com/iphon11musta1-300x300.jpg"
            },
            'iphone_8_plus_silver': {
                'name': 'iPhone 8 Plus 64GB Silver',
                'price': '519',
                'currency': 'US$',
                'imageUrl': "https://www.mhr.pt/196170/apple-iphone-8-plus-64gb-silver.jpg"
            }
        };

        function updateProduct() {
            var selectedPhone = document.getElementById("phoneSelect").value;
            var phone = phones[selectedPhone];

            document.getElementById("productName").textContent = phone.name;
            document.getElementById("productPrice").textContent = phone.currency + " " + parseFloat(phone.price).toFixed(2);
            document.getElementById("productImage").src = phone.imageUrl;
        }

        // Initialize with the first product
        updateProduct();
    </script>
</body>
</html>
