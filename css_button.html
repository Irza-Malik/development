<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button id="color_button" style="color: crimson;">click here to do magic</button>
    <script>
        document.getElementById("color_button").onclick=function(){
            document.getElementById("color_button").style.color="purple";
        };
    </script>
</body>
</html>
