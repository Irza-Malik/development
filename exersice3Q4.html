<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table id="sales" border="1">
        <thead>
            <tr>
                <th>Student</th>
                <th>Date</th>
                <th>Amount</th>
            </tr>
        </thead>
        <tbody>

        </tbody>
        <tfoot>
            <tr>
                <th>total sales</th>
                <th  colspan=2 id="soldAmount">$0.00</th>
            </tr>
        </tfoot>
    </table>
    <script>
        var sales = [
        {
            'student': 'Jason Gomes',
            'date': '10/06/2018',
            'amount': 34.99,
            'refundRequested': null
        },
        {
            'student': 'Carlos Blue',
            'date': '10/06/2018',
            'amount': 29.99,
            'refundRequested': null
            
        },
        {
            'student': 'Martin Heyes',
            'date': '11/06/2018',
            'amount': 39.99,
            'refundRequested': '13/06/2018'
            
        },
        {
            'student': 'Isabella Hopkins',
            'date': '11/06/2018',
            'amount': 29.99,
            'refundRequested': null
            
        },
        {
            'student': 'Andrew Walt',
            'date': '12/06/2018',
            'amount': 34.99,
            'refundRequested': null
        }
        ];
        let tableBody = document.querySelector("#sales tbody");
        let totalSales=0;
        sales.forEach(sale =>{
            if(sale.refundRequested===null){
                let row = document.createElement("tr");
                row.innerHTML = `
                <td>${sale.student}</td>
                <td>${sale.date}</td>
                <td>${sale.amount}</td>
`               ;
                tableBody.appendChild(row);
                totalSales += sale.amount;
                }
            });
        document.getElementById("soldAmount").innerText = `$${totalSales}`;
    </script>
</body>
</html>
